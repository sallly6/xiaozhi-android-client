name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 修复 Gradle 与 AGP 版本
      - name: Patch Gradle and AGP configs
        run: |
          # 1. 指定 Gradle 镜像源与超时
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.14-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=60000" >> android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. 升级 AGP 版本到 8.11.1 (关键修复)
          sed -i 's/com.android.application") version "8.7.0"/com.android.application") version "8.11.1"/g' android/settings.gradle.kts
          sed -i 's/com.android.application") version "8.7.0"/com.android.application") version "8.11.1"/g' android/settings.gradle
          sed -i 's/classpath "com.android.tools.build:gradle:8.7.0"/classpath "com.android.tools.build:gradle:8.11.1"/g' android/build.gradle
          
          # 3. 规避新版 DSL 校验
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
